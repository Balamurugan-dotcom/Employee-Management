<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Modern App Icon Container -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle Inner Border Glow -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1.5" />

  <!-- Dynamic TalentFlow "TF" Monogram & Flow Nodes -->
  <g filter="url(#shadow)">
    <!-- Top Horizontal Bar of 'T' -->
    <path d="M14 17 C14 15.343 15.343 14 17 14 L47 14 C48.657 14 50 15.343 50 17 C50 18.657 48.657 20 47 20 L17 20 C15.343 20 14 18.657 14 17 Z" fill="#ffffff" />
    
    <!-- Vertical Stem of 'T' & 'F' Spine -->
    <path d="M22 17 L22 47 C22 48.657 23.343 50 25 50 C26.657 50 28 48.657 28 47 L28 17 Z" fill="#ffffff" />

    <!-- Upper Arm of 'F' / Talent Flow Wave -->
    <path d="M26 27 C26 25.6 27.2 24.5 28.6 24.5 L43 24.5 C44.657 24.5 46 25.843 46 27.5 C46 29.157 44.657 30.5 43 30.5 L28.6 30.5 C27.2 30.5 26 29.4 26 27 Z" fill="#ffffff" />

    <!-- Lower Flow Wing / Accent -->
    <path d="M26 37 C26 35.6 27.2 34.5 28.6 34.5 L38 34.5 C39.657 34.5 41 35.843 41 37.5 C41 39.157 39.657 40.5 38 40.5 L28.6 40.5 C27.2 40.5 26 39.4 26 37 Z" fill="url(#cyanGlow)" />
    
    <!-- Spark / Talent Node Dot (Top Right) -->
    <circle cx="46" cy="17" r="3" fill="#38bdf8" />
  </g>
</svg>
